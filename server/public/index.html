<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Asistan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-widget">
    <div class="chat-header">🤖 AI Asistan</div>
    <div id="chat-messages" class="chat-messages">
      <div class="message bot">Merhaba! Sana nasıl yardımcı olabilirim?</div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="chat-input" placeholder="Bir mesaj yaz..." autocomplete="off" />
      <button id="send-btn">Gönder</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
